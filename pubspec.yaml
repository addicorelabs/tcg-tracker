name: tcg_tracker
description: "Tournament tracker for Yu-Gi-Oh! and Magic: The Gathering"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: 2.6.1

  # Navigation
  go_router: ^17.4.0

  # Local database (SQLite, WASM on web)
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Charts
  fl_chart: ^1.2.0

  # Formatting and localization
  intl: any

  # Browser APIs, used for the backup download and file picker
  web: ^1.1.1

  # Preferences and utilities
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  collection: ^1.19.1
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

  # Used by the migration test to build a database at the previous schema
  # version before the app opens and upgrades it.
  sqlite3: ^3.5.1

flutter:
  uses-material-design: true
  generate: true
