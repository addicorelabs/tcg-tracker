<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tournament tracker for Yu-Gi-Oh! and Magic: The Gathering">

  <!-- No <meta name="viewport"> here on purpose: Flutter Web injects its own at
       startup and replaces any tag found in this file, so declaring one only
       produces a console warning. -->
  <!-- The app's own background, not an accent: this colour paints the browser
       chrome and the splash screen, and anything else shows as a coloured band
       above the first frame. One value rather than a light/dark pair because
       the app opens dark whatever the system is set to. -->
  <meta name="theme-color" content="#101017">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black", not "black-translucent": translucent puts the page under the
       status bar, and Flutter Web does not inset its own app bar for it, so the
       title would sit behind the clock. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TCG Tracker">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TCG Tracker</title>
  <link rel="manifest" href="manifest.json">

  <!-- Installed on iOS, the status bar area is painted with the background of
       <body>, not with theme-color and not with the meta tag above: an unstyled
       body leaves a white band above the app. Flutter paints its own canvas over
       this, so the colour only ever shows where the app itself does not reach —
       the status bar, the home indicator, and the overscroll rubber band. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #101017;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
